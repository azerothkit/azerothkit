[package]
name = "azerothkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1"
directories = "6"
log = "0.4.35"
mitmproxy = {
    git = "https://github.com/azerothkit/mitmproxy_rs.git",
    rev = "cddbee77659bae2e8cc210f73b6c3eaa9c34cafe"
}
pem = "4"
prost = "0.13"
prost-reflect = "0.14"
prost-types = "0.13"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rustls-native-certs = "0.8.5"
serde_json = "1"
time = "0.3"
tokio = { version = "1.54.1", features = ["rt", "sync", "io-util", "time", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18"

[build-dependencies]
anyhow = "1.0.104"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
