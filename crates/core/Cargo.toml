[package]
name = "azerothkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1"
directories = "6"
log = "0.4.35"
mitmproxy = {
    git = "https://github.com/azerothkit/mitmproxy_rs.git",
    rev = "cddbee77659bae2e8cc210f73b6c3eaa9c34cafe"
}
pem = "4"
prost = "0.13"
prost-types = "0.13"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rustls-native-certs = "0.8.5"
time = "0.3"
tokio = { version = "1.54.1", features = ["rt", "sync", "io-util", "time", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18"
aes-gcm = "0.10.3"
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
specta = {
    version = "=2.0.0-rc.26",
    features = ["derive"],
    optional = true
}

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
anyhow = "1.0.104"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"

[features]
bindings = ["dep:specta"]
